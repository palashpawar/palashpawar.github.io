<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Travel Map - Palash Pawar</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <script src="theme.js"></script>
</head>
<body>
  <header class="floating-nav">
    <a href="index.html">Home</a>
    <a href="projects.html">Projects</a>
    <a href="experience.html">Experience</a>
  </header>

  <main class="with-nav map-page">
    <p class="map-count" id="mapCount"></p>
    <div id="map" class="travel-map"></div>
  </main>

  <footer>
    <p>&copy; 2026 Palash Pawar</p>
  </footer>

  <script>
    // Cities visited: [name, latitude, longitude]
    const cities = [
      // Texas
      ["Houston, TX", 29.7604, -95.3698],
      ["Austin, TX", 30.2672, -97.7431],
      ["Dallas, TX", 32.7767, -96.7970],
      ["San Antonio, TX", 29.4241, -98.4936],
      ["Corpus Christi, TX", 27.8006, -97.3964],
      ["South Padre Island, TX", 26.1118, -97.1681],

      // Rest of the U.S.
      ["New Orleans, LA", 29.9511, -90.0715],
      ["Destin, FL", 30.3935, -86.4958],
      ["Orlando, FL", 28.5383, -81.3792],
      ["Miami, FL", 25.7617, -80.1918],
      ["Key West, FL", 24.5551, -81.7800],
      ["Atlanta, GA", 33.7490, -84.3880],
      ["Nashville, TN", 36.1627, -86.7816],
      ["Gatlinburg, TN", 35.7143, -83.5102],
      ["Kansas City, MO", 39.0997, -94.5786],
      ["St. Louis, MO", 38.6270, -90.1994],
      ["Chicago, IL", 41.8781, -87.6298],
      ["Pittsburgh, PA", 40.4406, -79.9959],
      ["New York City, NY", 40.7128, -74.0060],
      ["Denver, CO", 39.7392, -104.9903],
      ["Alamogordo, NM", 32.8995, -105.9603],
      ["Los Angeles, CA", 34.0522, -118.2437],
      ["San Francisco, CA", 37.7749, -122.4194],

      // Canada, Mexico and Central America
      ["Toronto, Canada", 43.6532, -79.3832],
      ["Cancún, Mexico", 21.1619, -86.8515],
      ["Cozumel, Mexico", 20.4230, -86.9223],
      ["Guanacaste, Costa Rica", 10.6346, -85.4407],

      // Europe
      ["Madrid, Spain", 40.4168, -3.7038],
      ["Barcelona, Spain", 41.3874, 2.1686],
      ["Paris, France", 48.8566, 2.3522],
      ["Frankfurt, Germany", 50.1109, 8.6821],

      // India
      ["Mumbai, India", 19.0760, 72.8777],
      ["Pune, India", 18.5204, 73.8567],
      ["Nashik, India", 19.9975, 73.7898],
      ["Chennai, India", 13.0827, 80.2707],
    ];

    // Google's "night" palette, used when the site is in dark mode
    const darkStyle = [
      { elementType: "geometry", stylers: [{ color: "#242f3e" }] },
      { elementType: "labels.text.stroke", stylers: [{ color: "#242f3e" }] },
      { elementType: "labels.text.fill", stylers: [{ color: "#746855" }] },
      { featureType: "administrative.locality", elementType: "labels.text.fill", stylers: [{ color: "#d59563" }] },
      { featureType: "poi", elementType: "labels.text.fill", stylers: [{ color: "#d59563" }] },
      { featureType: "poi.park", elementType: "geometry", stylers: [{ color: "#263c3f" }] },
      { featureType: "poi.park", elementType: "labels.text.fill", stylers: [{ color: "#6b9a76" }] },
      { featureType: "road", elementType: "geometry", stylers: [{ color: "#38414e" }] },
      { featureType: "road", elementType: "geometry.stroke", stylers: [{ color: "#212a37" }] },
      { featureType: "road", elementType: "labels.text.fill", stylers: [{ color: "#9ca5b3" }] },
      { featureType: "road.highway", elementType: "geometry", stylers: [{ color: "#746855" }] },
      { featureType: "road.highway", elementType: "geometry.stroke", stylers: [{ color: "#1f2835" }] },
      { featureType: "road.highway", elementType: "labels.text.fill", stylers: [{ color: "#f3d19c" }] },
      { featureType: "transit", elementType: "geometry", stylers: [{ color: "#2f3948" }] },
      { featureType: "transit.station", elementType: "labels.text.fill", stylers: [{ color: "#d59563" }] },
      { featureType: "water", elementType: "geometry", stylers: [{ color: "#17263c" }] },
      { featureType: "water", elementType: "labels.text.fill", stylers: [{ color: "#515c6d" }] },
      { featureType: "water", elementType: "labels.text.stroke", stylers: [{ color: "#17263c" }] },
    ];
    const styleFor = () => (document.documentElement.dataset.theme === "dark" ? darkStyle : []);

    function initMap() {
      const map = new google.maps.Map(document.getElementById("map"), {
        styles: styleFor(),
        gestureHandling: "cooperative", // page scroll isn't hijacked; ctrl/two-finger to zoom
        mapTypeControl: false,
        streetViewControl: false,
        // keep the view inside the world so no grey bands show above/below it
        restriction: {
          latLngBounds: { north: 85, south: -85, west: -180, east: 180 },
          strictBounds: true,
        },
      });

      const info = new google.maps.InfoWindow();
      // Build bounds from min/max so the view spans Americas → Europe → India
      // instead of wrapping the short way across the Pacific
      const lats = cities.map(c => c[1]), lngs = cities.map(c => c[2]);
      const bounds = new google.maps.LatLngBounds(
        { lat: Math.min(...lats), lng: Math.min(...lngs) },
        { lat: Math.max(...lats), lng: Math.max(...lngs) }
      );
      for (const [name, lat, lng] of cities) {
        const marker = new google.maps.Marker({
          position: { lat, lng },
          map,
          title: name, // no custom icon: Google's classic red pin
        });
        marker.addListener("click", () => {
          info.setContent(`<span class="map-popup">${name}</span>`);
          info.open({ map, anchor: marker });
        });
      }

      map.fitBounds(bounds, 60);
      google.maps.event.addListenerOnce(map, "idle", () => {
        if (map.getZoom() > 6) map.setZoom(6);
      });

      new MutationObserver(() => map.setOptions({ styles: styleFor() }))
        .observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
    }

    document.getElementById("mapCount").textContent =
      `${cities.length} ${cities.length === 1 ? "city" : "cities"} visited`;
  </script>
  <!-- Replace YOUR_API_KEY with your Google Maps JavaScript API key -->
  <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAU7Ed_gfyZOxjNcIihbAQprkOrLixZC_c&callback=initMap&loading=async"></script>
</body>
</html>
