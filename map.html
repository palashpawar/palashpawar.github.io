  <script>

      ["Seattle, WA", 47.6062, -122.3321],

      // Canada, Mexico and Central America
      ["Toronto, Canada", 43.6532, -79.3832],
      ["Cancún, Mexico", 21.1619, -86.8515],
      ["Cozumel, Mexico", 20.4230, -86.9223],
      ["Guanacaste, Costa Rica", 10.6346, -85.4407],

      // Europe
      ["Madrid, Spain", 40.4168, -3.7038],
      ["London, United Kingdom", 51.5074, -0.1278],
      ["Barcelona, Spain", 41.3874, 2.1686],
      ["Paris, France", 48.8566, 2.3522],
      ["Frankfurt, Germany", 50.1109, 8.6821],

      // India
      ["Mumbai, India", 19.0760, 72.8777],
      ["New Delhi, India", 28.6139, 77.2090],
      ["Pune, India", 18.5204, 73.8567],
      ["Nashik, India", 19.9975, 73.7898],
      ["Chennai, India", 13.0827, 80.2707],
    ];

    // Airports on my flights: code → [city, latitude, longitude]
    const airports = {
      AUS: ["Austin", 30.1945, -97.6699],
      IAH: ["Houston", 29.9902, -95.3368],
      DFW: ["Dallas/Fort Worth", 32.8998, -97.0403],
      JFK: ["New York JFK", 40.6413, -73.7781],
      LGA: ["New York LaGuardia", 40.7769, -73.8740],
      EWR: ["Newark", 40.6895, -74.1745],
      ORD: ["Chicago O'Hare", 41.9742, -87.9073],
      MCI: ["Kansas City", 39.2976, -94.7139],
      SEA: ["Seattle", 47.4502, -122.3088],
      SNA: ["Orange County", 33.6762, -117.8675],
      MCO: ["Orlando", 28.4312, -81.3081],
      MIA: ["Miami", 25.7959, -80.2870],
      BUF: ["Buffalo", 42.9405, -78.7322],
      DTW: ["Detroit", 42.2162, -83.3554],
      PIT: ["Pittsburgh", 40.4915, -80.2329],
      YYZ: ["Toronto Pearson", 43.6777, -79.6248],
      CUN: ["Cancún", 21.0365, -86.8771],
      LIR: ["Liberia, Costa Rica", 10.5933, -85.5444],
      LHR: ["London Heathrow", 51.4700, -0.4543],
      CDG: ["Paris CDG", 49.0097, 2.5479],
      BCN: ["Barcelona", 41.2974, 2.0833],
      FRA: ["Frankfurt", 50.0379, 8.5622],
      DEL: ["Delhi", 28.5562, 77.1000],
      BOM: ["Mumbai", 19.0896, 72.8656],
      MAA: ["Chennai", 12.9941, 80.1709],
    };

    // Flights flown: [date, flight number, from, to]
    const flights = [
      ["2026-10-16", "AA2292", "AUS", "JFK"],
      ["2026-10-17", "AA2772", "JFK", "AUS"],
      ["2025-11-20", "BA194", "IAH", "LHR"],
      ["2025-11-21", "BA310", "LHR", "CDG"],
      ["2025-11-24", "VY8243", "CDG", "BCN"],
      ["2025-11-27", "BA475", "BCN", "LHR"],
      ["2025-11-27", "BA197", "LHR", "IAH"],
      ["2025-08-29", "NK2688", "IAH", "EWR"],
      ["2025-08-31", "UA1611", "EWR", "IAH"],
      ["2025-05-19", "UA1100", "IAH", "ORD"],
      ["2025-05-21", "UA310", "ORD", "MCI"],
      ["2025-05-25", "AA2100", "MCI", "DFW"],
      ["2025-05-25", "AA650", "DFW", "IAH"],
      ["2024-07-21", "LH441", "IAH", "FRA"],
      ["2024-07-22", "LH758", "FRA", "MAA"],
      ["2024-07-31", "LH759", "MAA", "FRA"],
      ["2024-07-31", "LH490", "FRA", "SEA"],
      ["2024-07-31", "UA1932", "SEA", "IAH"],
      ["2024-06-02", "NK712", "IAH", "EWR"],
      ["2024-06-03", "NK1343", "IAH", "LGA"],
      ["2024-06-05", "NK703", "EWR", "IAH"],
      ["2024-05-22", "AA1416", "IAH", "DFW"],
      ["2024-05-23", "AA3361", "DFW", "MCI"],
      ["2024-04-30", "UA1383", "IAH", "SNA"],
      ["2024-05-01", "UA2093", "SNA", "IAH"],
      ["2024-03-07", "F91098", "IAH", "MCO"],
      ["2024-03-07", "F9162", "MCO", "BUF"],
      ["2024-03-19", "DL2848", "BUF", "DTW"],
      ["2024-03-19", "DL1633", "DTW", "IAH"],
      ["2024-01-10", "UK950", "BOM", "DEL"],
      ["2024-01-11", "LH761", "DEL", "FRA"],
      ["2024-01-11", "LH440", "FRA", "IAH"],
      ["2023-12-16", "LH7600", "IAH", "FRA"],
      ["2023-12-17", "LH7252", "FRA", "DEL"],
      ["2023-12-18", "UK945", "DEL", "BOM"],
      ["2023-07-23", "NK1336", "IAH", "CUN"],
      ["2023-07-28", "NK412", "CUN", "IAH"],
      ["2023-06-24", "AA324", "IAH", "MIA"],
      ["2023-06-24", "AA1377", "MIA", "LIR"],
      ["2023-07-03", "AA1436", "LIR", "DFW"],
      ["2023-07-04", "AA2420", "DFW", "IAH"],
      ["2022-07-07", "DL1227", "IAH", "LGA"],
      ["2022-07-07", "DL4977", "LGA", "PIT"],
      ["2022-07-18", "UA1116", "BUF", "ORD"],
      ["2022-07-18", "UA2417", "ORD", "IAH"],
      ["2019-06-30", "AC594", "IAH", "YYZ"],
      ["2019-07-16", "AC593", "YYZ", "IAH"],
    ];

    // Airline from the flight number's 2-character prefix: [name, brand color for its route lines]
    const airlines = {
      AA: ["American Airlines", "#0ea5e9"],
      UA: ["United Airlines", "#2563eb"],
      DL: ["Delta Air Lines", "#9b1b3a"],
      BA: ["British Airways", "#e11d2e"],
      LH: ["Lufthansa", "#f5a800"],
      NK: ["Spirit Airlines", "#ffe100"],
      F9: ["Frontier Airlines", "#00875a"],
      VY: ["Vueling", "#ffc72c"],
      UK: ["Vistara", "#7b2d6e"],
      AC: ["Air Canada", "#ff5a5f"],
    };
    const airlineOf = num => airlines[num.slice(0, 2)] || [num.slice(0, 2), "#888888"];

    // Great-circle distance in miles
    const miles = (a, b) => {
      const R = 3958.8, rad = d => d * Math.PI / 180;
      const [, la1, lo1] = airports[a], [, la2, lo2] = airports[b];
      const h = Math.sin(rad(la2 - la1) / 2) ** 2 + Math.cos(rad(la1)) * Math.cos(rad(la2)) * Math.sin(rad(lo2 - lo1) / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(h));
    };

    // Google's "night" palette, used when the site is in dark mode
    const darkStyle = [
      { elementType: "geometry", stylers: [{ color: "#242f3e" }] },
      { elementType: "labels.text.stroke", stylers: [{ color: "#242f3e" }] },
      { elementType: "labels.text.fill", stylers: [{ color: "#746855" }] },
      { featureType: "administrative.locality", elementType: "labels.text.fill", stylers: [{ color: "#d59563" }] },
      { featureType: "poi", elementType: "labels.text.fill", stylers: [{ color: "#d59563" }] },
      { featureType: "poi.park", elementType: "geometry", stylers: [{ color: "#263c3f" }] },
      { featureType: "poi.park", elementType: "labels.text.fill", stylers: [{ color: "#6b9a76" }] },
      { featureType: "road", elementType: "geometry", stylers: [{ color: "#38414e" }] },
      { featureType: "road", elementType: "geometry.stroke", stylers: [{ color: "#212a37" }] },
      { featureType: "road", elementType: "labels.text.fill", stylers: [{ color: "#9ca5b3" }] },
      { featureType: "road.highway", elementType: "geometry", stylers: [{ color: "#746855" }] },
      { featureType: "road.highway", elementType: "geometry.stroke", stylers: [{ color: "#1f2835" }] },
      { featureType: "road.highway", elementType: "labels.text.fill", stylers: [{ color: "#f3d19c" }] },
      { featureType: "transit", elementType: "geometry", stylers: [{ color: "#2f3948" }] },
      { featureType: "transit.station", elementType: "labels.text.fill", stylers: [{ color: "#d59563" }] },
      { featureType: "water", elementType: "geometry", stylers: [{ color: "#17263c" }] },
      { featureType: "water", elementType: "labels.text.fill", stylers: [{ color: "#515c6d" }] },
      { featureType: "water", elementType: "labels.text.stroke", stylers: [{ color: "#17263c" }] },
    ];
    const styleFor = () => (document.documentElement.dataset.theme === "dark" ? darkStyle : []);

    function initMap() {
      const map = new google.maps.Map(document.getElementById("map"), {
        styles: styleFor(),
        gestureHandling: "cooperative", // page scroll isn't hijacked; ctrl/two-finger to zoom
        mapTypeControl: false,
        streetViewControl: false,
        // keep the view inside the world so no grey bands show above/below it
        restriction: {
          latLngBounds: { north: 85, south: -85, west: -180, east: 180 },
          strictBounds: true,
        },
      });

      const isDark = () => document.documentElement.dataset.theme === "dark";
      const routeColor = () => (isDark() ? "#5ecfff" : "#4f46e5");
      const dotColor = () => (isDark() ? "#ffffff" : "#1b1e29");
      const info = new google.maps.InfoWindow();
      const pos = code => ({ lat: airports[code][1], lng: airports[code][2] });
      const fmtDate = d => new Date(d + "T12:00:00").toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" });

      // every flight on an airport pair (either direction), for the popup
      const pairOf = f => [f[2], f[3]].sort().join("-");
      const pairs = new Map();
      for (const f of flights) {
        if (!pairs.has(pairOf(f))) pairs.set(pairOf(f), []);
        pairs.get(pairOf(f)).push(f);
      }

      const showPair = (key, latLng) => {
        const [a, b] = key.split("-");
        const legs = [...pairs.get(key)].sort((x, y) => x[0].localeCompare(y[0]));
        const rows = legs.map(([d, num, from, to]) => {
          const [name, color] = airlineOf(num);
          return `<div><span class="popup-swatch" style="background:${color}"></span>${fmtDate(d)} · ${name} <b>${num}</b> · ${from} → ${to}</div>`;
        }).join("");
        info.setContent(`<div class="map-popup"><b>${airports[a][0]} (${a}) ⇄ ${airports[b][0]} (${b})</b>` +
          `<div class="popup-sub">${Math.round(miles(a, b)).toLocaleString()} mi · flown ${legs.length}×</div>${rows}</div>`);
        info.setPosition(latLng);
        info.open({ map });
      };

      // one arc per airport pair and airline, in the airline's color; flown more often → thicker
      const arcs = new Map();
      for (const f of flights) {
        const key = `${pairOf(f)}|${f[1].slice(0, 2)}`;
        arcs.set(key, (arcs.get(key) || 0) + 1);
      }
      const lines = [];
      for (const [key, n] of arcs) {
        const [pair, carrier] = key.split("|");
        const [a, b] = pair.split("-");
        const line = new google.maps.Polyline({
          map,
          path: [pos(a), pos(b)],
          geodesic: true,            // follow the great-circle path, like a real flight
          strokeColor: airlineOf(carrier)[1],
          strokeOpacity: 0.85,
          strokeWeight: 1.5 + n,
        });
        line.addListener("mouseover", () => line.setOptions({ strokeOpacity: 1, zIndex: 10 }));
        line.addListener("mouseout", () => line.setOptions({ strokeOpacity: 0.85, zIndex: 1 }));
        line.addListener("click", e => showPair(pair, e.latLng));
        lines.push(line);
      }

      // small dot on every airport
      const codes = [...new Set(flights.flatMap(f => [f[2], f[3]]))];
      const dots = codes.map(code => {
        const dot = new google.maps.Marker({
          map,
          position: pos(code),
          title: `${airports[code][0]} (${code})`,
          icon: { path: google.maps.SymbolPath.CIRCLE, scale: 4, fillColor: dotColor(), fillOpacity: 1, strokeColor: routeColor(), strokeWeight: 2 },
          zIndex: 20,
        });
        dot.addListener("click", () => {
          const n = flights.filter(f => f[2] === code || f[3] === code).length;
          info.setContent(`<div class="map-popup"><b>${airports[code][0]} (${code})</b><div class="popup-sub">${n} flight${n === 1 ? "" : "s"}</div></div>`);
          info.open({ map, anchor: dot });
        });
        return dot;
      });

      // Bounds come from min/max so the view spans Americas → Europe → India
      // instead of wrapping the short way across the Pacific
      const pts = codes.map(pos);
      const bounds = new google.maps.LatLngBounds(
        { lat: Math.min(...pts.map(p => p.lat)), lng: Math.min(...pts.map(p => p.lng)) },
        { lat: Math.max(...pts.map(p => p.lat)), lng: Math.max(...pts.map(p => p.lng)) }
      );

      map.fitBounds(bounds, 60);
      google.maps.event.addListenerOnce(map, "idle", () => {
        if (map.getZoom() > 6) map.setZoom(6);
      });

      new MutationObserver(() => {
        map.setOptions({ styles: styleFor() });
        dots.forEach(d => d.setIcon({ ...d.getIcon(), fillColor: dotColor(), strokeColor: routeColor() }));
      }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
    }

    // "Dallas, TX" → United States (two-letter state code); "Paris, France" → France
    const countryOf = name => {
      const place = name.split(", ").pop();
      return /^[A-Z]{2}$/.test(place) ? "United States" : place;
    };
    const countries = [...new Set(cities.map(([name]) => countryOf(name)))];
    const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
    const count = document.getElementById("mapCount");
    count.textContent = `${plural(cities.length, "city", "cities")} · ${plural(countries.length, "country", "countries")} visited`;
    count.title = countries.join(", ");
    const totalMiles = Math.round(flights.reduce((sum, f) => sum + miles(f[2], f[3]), 0));
    const airportCount = new Set(flights.flatMap(f => [f[2], f[3]])).size;
    // legend: airlines flown, most-flown first
    const flownBy = {};
    flights.forEach(f => { const c = f[1].slice(0, 2); flownBy[c] = (flownBy[c] || 0) + 1; });
    const legend = document.getElementById("airlineLegend");
    Object.entries(flownBy).sort((x, y) => y[1] - x[1]).forEach(([c, n]) => {
      const [name, color] = airlineOf(c);
      const item = document.createElement("span");
      item.className = "airline-key";
      const sw = document.createElement("span");
      sw.className = "airline-swatch";
      sw.style.background = color;
      item.append(sw, `${name} ${n}`);
      legend.append(item);
    });
    document.getElementById("flightCount").textContent =
      `${plural(flights.length, "flight", "flights")} · ${plural(airportCount, "airport", "airports")} · ${totalMiles.toLocaleString()} miles flown`;
  </script>
