    // Flights flown: [date, flight number, from, to]
    const flights = [
      ["2026-12-27", "UA3000", "AMS", "IAH"],   // sold as Swiss 3000, flown by United
      ["2026-12-27", "LX724", "ZRH", "AMS"],
      ["2026-12-27", "LX155", "BOM", "ZRH"],
      ["2026-12-05", "AI128", "LHR", "BOM"],

      ["2024-05-22", "AA1416", "IAH", "DFW"],

      ["2024-04-30", "UA1383", "IAH", "SNA"],
      ["2024-05-01", "UA2093", "SNA", "IAH"],
      ["2024-03-07", "F91098", "IAH", "MCO"],
      ["2024-03-07", "F9162", "MCO", "BUF"],
      ["2024-03-19", "DL2848", "BUF", "DTW"],
      ["2024-03-19", "DL1633", "DTW", "IAH"],
      ["2024-01-10", "UK950", "BOM", "DEL"],
      ["2024-01-11", "LH761", "DEL", "FRA"],
      ["2024-01-11", "LH440", "FRA", "IAH"],
      ["2023-12-16", "LH7600", "IAH", "FRA"],
      ["2023-12-17", "LH7252", "FRA", "DEL"],
      ["2023-12-18", "UK945", "DEL", "BOM"],
      ["2023-07-23", "NK1336", "IAH", "CUN"],
      ["2023-07-28", "NK412", "CUN", "IAH"],
      ["2023-06-24", "AA324", "IAH", "MIA"],
      ["2023-06-24", "AA1377", "MIA", "LIR"],
      ["2023-07-03", "AA1436", "LIR", "DFW"],
      ["2023-07-04", "AA2420", "DFW", "IAH"],
      ["2022-07-07", "DL1227", "IAH", "LGA"],
      ["2022-07-07", "DL4977", "LGA", "PIT"],
      ["2022-07-18", "UA1116", "BUF", "ORD"],
      ["2022-07-18", "UA2417", "ORD", "IAH"],
      ["2022-01-04", "DL2521", "ATL", "IAH"],
      ["2022-01-04", "KL623", "AMS", "ATL"],
      ["2022-01-04", "KL878", "BOM", "AMS"],
      ["2021-12-20", "KL9494", "AMS", "BOM"],   // sold as Delta 9494, flown by KLM
      ["2021-12-19", "KL9459", "IAH", "AMS"],   // sold as Delta 9459, flown by KLM
      ["2019-06-30", "AC594", "IAH", "YYZ"],
      ["2019-07-16", "AC593", "YYZ", "IAH"],
    ];

    // Airline from the flight number's 2-character prefix: [name, brand color for its route lines]
    const airlines = {
      AA: ["American Airlines", "#0ea5e9"],
      UA: ["United Airlines", "#2563eb"],
      DL: ["Delta Air Lines", "#9b1b3a"],
      BA: ["British Airways", "#e11d2e"],
      LH: ["Lufthansa", "#f5a800"],
      NK: ["Spirit Airlines", "#ffe100"],
      F9: ["Frontier Airlines", "#00875a"],
      VY: ["Vueling", "#ffc72c"],
      UK: ["Vistara", "#7b2d6e"],
      AC: ["Air Canada", "#ff5a5f"],
      Y4: ["Volaris", "#c2268f"],
      KL: ["KLM", "#00a1de"],
      AI: ["Air India", "#d7282f"],
      LX: ["Swiss", "#e2001a"],
    };
    const airlineOf = num => airlines[num.slice(0, 2)] || [num.slice(0, 2), "#888888"];

    // Great-circle distance in miles
    const miles = (a, b) => {
      const R = 3958.8, rad = d => d * Math.PI / 180;
      const [, la1, lo1] = airports[a], [, la2, lo2] = airports[b];
      const h = Math.sin(rad(la2 - la1) / 2) ** 2 + Math.cos(rad(la1)) * Math.cos(rad(la2)) * Math.sin(rad(lo2 - lo1) / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(h));
    };

    const countryOf = name => {
      // "Dallas, TX" → United States (two-letter state code); "Paris, France" → France
      const place = name.split(", ").pop();
      return /^[A-Z]{2}$/.test(place) ? "United States" : place;
    };
    const countries = [...new Set(cities.map(([name]) => countryOf(name)))];
    const totalMiles = Math.round(flights.reduce((sum, f) => sum + miles(f[2], f[3]), 0));
    const codes = [...new Set(flights.flatMap(f => [f[2], f[3]]))];
    const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

    // ---- departure board: each character flips through random ones before settling ----
    const board = document.getElementById("board");
    board.title = countries.join(", ");
    const stats = [["cities", cities.length], ["countries", countries.length], ["flights", flights.length],
                   ["airports", codes.length], ["miles", totalMiles.toLocaleString()]];
    stats.forEach(([label, value], s) => {
      const box = document.createElement("div");
      box.className = "flap-stat";
      box.innerHTML = `<span class="flap-label">${label}</span><span class="flap-cells" aria-label="${value} ${label}"></span>`;
      const cells = box.querySelector(".flap-cells");
      [...String(value)].forEach((ch, i) => {
        const cell = document.createElement("span");
        cell.className = /\d/.test(ch) ? "flap" : "flap flap-sep";
        cell.setAttribute("aria-hidden", "true");
        cell.textContent = ch;
        cells.append(cell);
        if (still || !/\d/.test(ch)) return;
        const stopAt = performance.now() + 500 + s * 220 + i * 90;
        const tick = setInterval(() => {
          if (performance.now() >= stopAt) { clearInterval(tick); cell.textContent = ch; return; }
          cell.textContent = Math.floor(Math.random() * 10);
        }, 55);
      });
      board.append(box);
    });

    // ---- legend: airlines flown, most-flown first ----
    const flownBy = {};
    flights.forEach(f => { const c = f[1].slice(0, 2); flownBy[c] = (flownBy[c] || 0) + 1; });
    const legend = document.getElementById("airlineLegend");
    Object.entries(flownBy).sort((x, y) => y[1] - x[1]).forEach(([c, n]) => {
      const [name, color] = airlineOf(c);
      // airline marks (from Google Flights, backgrounds removed; Vistara from its brand art); the left bar is the route color
      const item = document.createElement("div");
      item.className = "airline-key";
      item.style.borderLeftColor = color;
      const logo = document.createElement("img");
      logo.src = `img/airline-${c}.png`;
      logo.alt = "";
      logo.onerror = () => logo.remove();
      const label = document.createElement("span");
      label.textContent = name.toLowerCase();
      const count = document.createElement("span");
      count.className = "airline-count";
      count.textContent = n;
      item.append(logo, label, count);
      legend.append(item);
    });

    // ---- dot-matrix map: land as a dot grid, routes as arcs with planes moving along them ----
    const BASE = { w: -130, e: 92, n: 64, s: 2 };          // lon/lat window around every route
    const KM = Math.cos(35 * Math.PI / 180);                // squash longitude like a mid-latitude map
    const ASPECT = (BASE.n - BASE.s) / ((BASE.e - BASE.w) * KM);
    let VIEW = { ...BASE };
    const canvas = document.getElementById("dotmap"), ctx = canvas.getContext("2d");
    const tip = document.getElementById("tip");
    let W = 0, H = 0, landDots = [], routes = [], hover = null, landGeo = null;
    // colours come from the page theme so the map follows the light/dark toggle
    let ink = {};
    const readInk = () => {
      const css = getComputedStyle(document.documentElement);
      ink = { land: css.getPropertyValue("--land").trim(), fg: css.getPropertyValue("--fg").trim(),
              accent: css.getPropertyValue("--accent").trim() };
    };
    readInk();
    document.addEventListener("modechange", () => { readInk(); if (still) draw(0); });
    const project = (lat, lon) => [(lon - VIEW.w) / (VIEW.e - VIEW.w) * W, (VIEW.n - lat) / (VIEW.n - VIEW.s) * H];
    const fmtDate = d => new Date(d + "T12:00:00").toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" }).toLowerCase();

    // one arc per airport pair + airline; flown more often → thicker
    const pairOf = f => [f[2], f[3]].sort().join("-");
    const groups = new Map();
    for (const f of flights) {
      const key = `${pairOf(f)}|${f[1].slice(0, 2)}`;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(f);
    }

    function layout() {
      const wrap = canvas.parentElement;
      W = Math.max(wrap.clientWidth, 640);  // shortcut: phones scroll the map sideways instead of shrinking it
      // when the legend sits beside the map, grow the map to the legend's height and show more
      // latitude (same scale, no stretching) so the two line up
      const leg = document.getElementById("airlineLegend");
      const beside = leg && leg.getBoundingClientRect().top < wrap.getBoundingClientRect().bottom - 1;
      H = Math.max(Math.round(W * ASPECT), beside ? Math.round(leg.getBoundingClientRect().height) - 2 : 0);
      const span = H / W * (BASE.e - BASE.w) * KM, mid = (BASE.n + BASE.s) / 2 + 4;   // bias north: routes sit above the equator
      VIEW = { w: BASE.w, e: BASE.e, n: Math.min(84, mid + span / 2), s: Math.min(84, mid + span / 2) - span };
      const dpr = devicePixelRatio || 1;
      canvas.width = W * dpr; canvas.height = H * dpr;
      canvas.style.width = W + "px"; canvas.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      routes = [...groups].map(([key, legs], i) => {
        const [pair, carrier] = key.split("|");
        const [a, b] = pair.split("-");
        const [x1, y1] = project(airports[a][1], airports[a][2]);
        const [x2, y2] = project(airports[b][1], airports[b][2]);
        const len = Math.hypot(x2 - x1, y2 - y1);
        // bow every arc upward (north) by a share of its length
        let nx = -(y2 - y1) / len, ny = (x2 - x1) / len;
        if (ny > 0) { nx = -nx; ny = -ny; }
        const cx = (x1 + x2) / 2 + nx * len * 0.22, cy = (y1 + y2) / 2 + ny * len * 0.22;
        const pts = [];
        for (let k = 0; k <= 60; k++) {
          const t = k / 60, u = 1 - t;
          pts.push([u * u * x1 + 2 * u * t * cx + t * t * x2, u * u * y1 + 2 * u * t * cy + t * t * y2]);
        }
        // the arc is drawn a→b (codes sorted); +1 = a plane flew a→b on this airline, -1 = b→a
        const dirs = [...new Set(legs.map(f => (f[2] === a ? 1 : -1)))];
        return { pair, carrier, legs, dirs, color: airlineOf(carrier)[1], width: 0.8 + 0.6 * legs.length, pts,
                 speed: 70 / Math.max(len, 40), phase: (i * 0.37) % 1 };
      });

      landDots = [];
      if (!landGeo) return;
      const off = document.createElement("canvas");
      off.width = W; off.height = H;
      const o = off.getContext("2d");
      // fill each polygon on its own; one that crosses the antimeridian (Eurasia's Chukotka tip) gets
      // its stray points shifted 360° to the side most of it is on, so it doesn't smear across the map
      for (const feature of landGeo.features) {
        const polys = feature.geometry.type === "Polygon" ? [feature.geometry.coordinates] : feature.geometry.coordinates;
        for (const poly of polys) {
          const lons = poly[0].map(p => p[0]);
          const wraps = Math.max(...lons) - Math.min(...lons) > 300;
          const east = lons.filter(l => l > 0).length > lons.length / 2;
          const fix = lon => !wraps ? lon : east && lon < -150 ? lon + 360 : !east && lon > 150 ? lon - 360 : lon;
          o.beginPath();
          for (const ring of poly) ring.forEach(([lon, lat], k) => {
            const [x, y] = project(lat, fix(lon));
            k ? o.lineTo(x, y) : o.moveTo(x, y);
          });
          o.fill("evenodd");
        }
      }
      const mask = o.getImageData(0, 0, W, H).data, step = Math.max(5, W / 150);
      for (let y = step / 2; y < H; y += step) for (let x = step / 2; x < W; x += step)
        if (mask[(Math.floor(y) * W + Math.floor(x)) * 4 + 3] > 128) landDots.push([x, y]);
    }

    function draw(now) {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = ink.land;
      for (const [x, y] of landDots) { ctx.beginPath(); ctx.arc(x, y, 1.4, 0, 7); ctx.fill(); }

      for (const r of routes) {
        const lit = !hover || (hover.route ? hover.route.pair === r.pair : r.pair.split("-").includes(hover.code));
        ctx.globalAlpha = lit ? 0.85 : 0.12;
        ctx.strokeStyle = r.color; ctx.lineWidth = r.width;
        ctx.beginPath(); r.pts.forEach(([x, y], k) => k ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
        if (still || !lit) continue;
        // one plane per direction actually flown: a bright head with a short trail behind it
        r.dirs.forEach(d => {
          const t = (r.phase + (d < 0 ? 0.5 : 0) + now / 1000 * r.speed) % 1, head = Math.floor(t * 60);
          for (let k = 0; k < 8 && head - k >= 0; k++) {
            const p = r.pts[d > 0 ? head - k : 60 - (head - k)];
            ctx.globalAlpha = (1 - k / 8) * 0.9;
            ctx.fillStyle = ink.fg;
            ctx.beginPath(); ctx.arc(p[0], p[1], k ? 1.2 : 2, 0, 7); ctx.fill();
          }
        });
      }
      ctx.globalAlpha = 1;

      codes.forEach((code, i) => {
        const [x, y] = project(airports[code][1], airports[code][2]);
        if (!still) {
          const p = ((now / 2400) + i * 0.13) % 1;
          ctx.strokeStyle = `rgba(91,140,255,${1 - p})`; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.arc(x, y, 3 + p * 9, 0, 7); ctx.stroke();
        }
        ctx.fillStyle = hover && hover.code === code ? ink.accent : ink.fg;
        ctx.beginPath(); ctx.arc(x, y, 2.6, 0, 7); ctx.fill();
      });
    }

    function showTip(html, x, y) {
      tip.innerHTML = html; tip.hidden = false;
      tip.style.left = Math.min(x + 14, W - tip.offsetWidth - 4) + "px";
      tip.style.top = Math.max(y - tip.offsetHeight - 10, 4) + "px";
    }
    function onPoint(e) {
      const box = canvas.getBoundingClientRect(), mx = e.clientX - box.left, my = e.clientY - box.top;
      let best = null, bestD = 12;
      for (const code of codes) {
        const [x, y] = project(airports[code][1], airports[code][2]), d = Math.hypot(mx - x, my - y);
        if (d < bestD) { best = { code }; bestD = d; }
      }
      if (!best) {
        bestD = 7;
        for (const r of routes) for (const [x, y] of r.pts) {
          const d = Math.hypot(mx - x, my - y);
          if (d < bestD) { best = { route: r }; bestD = d; }
        }
      }
      hover = best;
      if (!best) { tip.hidden = true; }
      else if (best.code) {
        const n = flights.filter(f => f[2] === best.code || f[3] === best.code).length;
        showTip(`<b>${best.code}</b> · ${airports[best.code][0].toLowerCase()}<br>${n} flight${n === 1 ? "" : "s"}`, mx, my);
      } else {
        const [a, b] = best.route.pair.split("-");
        const legs = flights.filter(f => pairOf(f) === best.route.pair).sort((x, y) => x[0].localeCompare(y[0]));
        showTip(`<b>${a} ⇄ ${b}</b> · ${Math.round(miles(a, b)).toLocaleString()} mi · flown ${legs.length}×` +
          legs.map(([d, num, from, to]) => `<br><span class="tip-dim">${fmtDate(d)} · ${num} · ${from} → ${to}</span>`).join(""), mx, my);
      }
      if (still) draw(0);
    }
    canvas.addEventListener("pointermove", onPoint);
    canvas.addEventListener("pointerdown", onPoint);
    canvas.addEventListener("pointerleave", () => { hover = null; tip.hidden = true; if (still) draw(0); });

    layout();
    addEventListener("resize", () => { layout(); if (still) draw(0); });
    if (still) draw(0);
    else (function loop(now) { draw(now); requestAnimationFrame(loop); })(performance.now());

    // land outlines (Natural Earth 1:110m via world-atlas); routes still draw if this fails
    fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-110m.json")
      .then(r => r.json())
      .then(topo => { landGeo = topojson.feature(topo, topo.objects.land); layout(); if (still) draw(0); })
      .catch(() => {});
  </script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
</body>
