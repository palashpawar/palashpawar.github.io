name: Update sports data

# sports.html reads ESPN live, but falls back to data/sports.json when ESPN fails
# or blocks the browser. This refreshes that snapshot every hour.
on:
  schedule:
    - cron: "17 * * * *"   # hourly, off the top of the hour (GitHub delays :00 jobs most)
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: write           # commit the refreshed data file
  pages: write              # request a Pages rebuild after committing

concurrency:
  group: data-commits       # never overlap with another run of this job
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch ESPN data
        run: python3 scripts/update_sports.py

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- data/sports.json && ! git ls-files --others --exclude-standard -- data/sports.json | grep -q .; then
            echo "Sports data unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sports.json
          git commit -m "Update sports data"
          # other jobs (or a manual push) may have landed since checkout
          for attempt in 1 2 3; do
            git pull --rebase && git push && break
            sleep 10
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with the workflow token don't always kick off a Pages build, so ask for one.
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
