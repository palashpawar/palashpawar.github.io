<body>

  <main class="with-nav sports-page">
    <p class="sports-note" id="sportsNote">Loading live standings…</p>
    <nav class="league-tabs" id="leagueTabs" aria-label="Filter by league"></nav>
    <div class="team-cards" id="teamCards"></div>
    <p class="sports-footnote">Soccer records are wins-draws-losses.<span id="fifaDate"></span></p>
  </main>

  <footer>
    <p>&copy; 2026 Palash Pawar</p>
  </footer>

  <script>
    // Teams I follow: [ESPN sport/league path, ESPN team id, league label, soccer?,
    //                  FIFA country code (national teams), crest image to use instead of ESPN's logo,
    //                  optional dark-mode crest]
    const teams = [
      ["soccer/eng.1", 360, "Premier League", true],
      ["soccer/fra.1", 160, "Ligue 1", true],
      ["soccer/esp.1", 86, "LALIGA", true],
      ["soccer/usa.1", 6077, "MLS", true],
      ["football/college-football", 251, "College Football", false],
      ["football/college-football", 197, "College Football", false, null, "img/osu-logo.png"],
      ["football/college-football", 248, "College Football", false],
      ["football/nfl", 34, "NFL", false],
      ["basketball/nba", 10, "NBA", false],
      ["soccer/all", 660, "International", true, "USA", "img/nat-usa.png", "img/nat-usa-dark.png"],
      ["soccer/all", 478, "International", true, "FRA", "img/nat-france.png"],
      ["soccer/all", 4385, "International", true, "IND", "img/nat-india.png"],
    ];

    // National teams have no league table; their position is the FIFA World Ranking,
    // which scripts/update_fifa_rankings.py saves here (FIFA's API can't be called from the browser)
    const fifa = fetch("data/fifa-rankings.json").then(r => r.json()).catch(() => null);

    const isDark = () => document.documentElement.dataset.theme === "dark";

    // Pick ESPN's dark-background logo variant in dark mode when one exists
    const logoFor = (logos, dark) => {
      const pick = logos.find(l => l.rel.includes("default") && l.rel.includes(dark ? "dark" : "full") && !l.rel.includes("scoreboard"))
        || logos.find(l => l.rel.includes(dark ? "dark" : "full"))
        || logos[0];
      return pick ? pick.href : "";
    };

    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    }

    // League tab each team belongs to (only tabs that have teams are shown)
    const tabOf = ([path, , , , fifaCode]) =>
      fifaCode ? "International" : path.startsWith("soccer") ? "Soccer"
      : path.endsWith("college-football") ? "NCAAF" : path.endsWith("nfl") ? "NFL" : "NBA";
    const TAB_ORDER = ["All", "Soccer", "NFL", "NCAAF", "NBA", "International"];

    const tabs = document.getElementById("leagueTabs");
    const grid = document.getElementById("teamCards");
    TAB_ORDER.filter(tab => tab === "All" || teams.some(t => tabOf(t) === tab)).forEach(tab => {
      const b = el("button", "league-tab", tab);
      b.type = "button";
      b.setAttribute("aria-pressed", tab === "All" ? "true" : "false");
      b.addEventListener("click", () => {
        tabs.querySelectorAll(".league-tab").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
        grid.querySelectorAll(".team-card").forEach(c => { c.hidden = tab !== "All" && c.dataset.tab !== tab; });
      });
      tabs.append(b);
    });

    const isCollege = t => t[0].endsWith("college-football");

    // Real-style stat tile: small grey label over a big number
    function tile(label, value, note) {
      const box = el("div", "stat-tile");
      box.append(el("span", "stat-label", label), el("span", "stat-value", value));
      if (note) box.append(el("span", "stat-note", note));
      return box;
    }

    function renderCard(card, t, team, rankings) {
      const [, , league, soccer, fifaCode, crest, crestDark] = t;
      const rec = (team.record && team.record.items && team.record.items[0]) || {};
      const s = Object.fromEntries((rec.stats || []).map(x => [x.name, x.value]));
      const n = v => (v == null ? "–" : String(Math.round(v)));

      // header: logo · name + league · position badge
      const head = el("a", "card-head");
      const clubhouse = (team.links || []).find(l => l.rel.includes("clubhouse"));
      if (clubhouse) { head.href = clubhouse.href; head.target = "_blank"; head.rel = "noopener"; }
      const img = el("img", "team-logo");
      img.alt = "";
      if (crest) {
        img.dataset.crest = crest;
        img.dataset.crestDark = crestDark || crest;
        img.src = isDark() ? img.dataset.crestDark : crest;
      } else {
        img.dataset.logos = JSON.stringify(team.logos || []);
        img.src = logoFor(team.logos || [], isDark());
      }
      const names = el("div", "card-names");
      const nm = el("span", "team-name");
      nm.textContent = team.displayName;   // always the full name, on phones too
      names.append(nm, el("span", "team-league", league));

      // "12th in English Premier League" → place "12th", group "English Premier League"
      const m = (team.standingSummary || "").match(/^(\S+)\s+in\s+(.+)$/);
      const conf = m ? m[2].replace(/ Division$/, " Div.").replace(/^(North|South)(east|west)\b/, (w, a, b) => a[0] + b[0].toUpperCase()) : "";
      const f = fifaCode && rankings && rankings.teams[fifaCode];
      const badgeText = fifaCode ? (f ? `#${f.rank}` : "–") : (m ? m[1] : "–");
      const badge = el("div", "rank-badge");
      badge.append(el("span", "rank-value", badgeText), el("span", "rank-label", fifaCode ? "FIFA rank" : soccer ? "in league" : conf));
      head.append(img, names, badge);

      // stat tiles
      const stats = el("div", "stat-row");
      // the badge already shows the position, so the tiles add what it doesn't
      if (fifaCode) {
        const move = f && f.previousRank ? f.previousRank - f.rank : 0;
        stats.append(tile("FIFA pts", f && f.points != null ? String(Math.round(f.points)) : "–"),
                     tile("Prev rank", f && f.previousRank ? `#${f.previousRank}` : "–"),
                     tile("Change", move > 0 ? `▲${move}` : move < 0 ? `▼${-move}` : "–"));
      } else if (soccer) {
        const gp = [s.wins, s.ties, s.losses].every(v => v != null) ? String(s.wins + s.ties + s.losses) : "–";
        stats.append(tile("Pts", n(s.points)), tile("W-D-L", `${n(s.wins)}-${n(s.ties)}-${n(s.losses)}`), tile("Played", gp));
      } else {
        const [w, l] = (rec.summary || "").split("-").map(Number);
        const gp = w + l;
        const pct = gp > 0 ? (w / gp).toFixed(3).replace(/^0/, "") : "–";   // .667 style
        const ap = team.rank && team.rank <= 25 ? `#${team.rank}` : "–";
        stats.append(tile("Record", rec.summary || "–"), tile("Win %", pct),
                     isCollege(t) ? tile("AP poll", ap) : tile("Played", Number.isFinite(gp) ? String(gp) : "–"));
      }

      const games = el("div", "game-rows");
      games.append(el("div", "game-row game-last", ""), el("div", "game-row game-next", ""));
      card.replaceChildren(head, stats, games);
    }

    const cards = teams.map(t => {
      const card = el("article", "team-card");
      card.dataset.tab = tabOf(t);
      card.append(el("p", "card-loading", `Loading ${t[2]}…`));
      grid.append(card);
      return card;
    });

    // Next game: first fixture that hasn't finished. Soccer uses the "all" feed so cup and
    // Champions League games count too; fixture=true returns upcoming games rather than results.
    // Soccer's feed returns results by default and upcoming games with fixture=true, so it needs
    // both; the other sports return the whole season in one feed.
    const scheduleUrls = ([path, id, , soccer]) => {
      const base = `https://site.api.espn.com/apis/site/v2/sports/${soccer ? "soccer/all" : path}/teams/${id}/schedule`;
      return soccer ? [base, `${base}?fixture=true`] : [base];
    };
    // Hourly snapshot of the same ESPN feeds, saved by .github/workflows/update-sports.yml
    // (scripts/update_sports.py). Used for any team whose live request fails.
    const snapshot = fetch("data/sports.json").then(r => r.json()).catch(() => null);
    let usedSnapshot = false;

    const getJSON = u => fetch(u, { signal: AbortSignal.timeout(8000) })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });

    const loadLive = t => Promise.all(scheduleUrls(t).map(getJSON)).then(feeds => {
      const byId = new Map();
      feeds.forEach(f => (f.events || []).forEach(ev => byId.set(ev.id, ev)));
      // each feed also describes the team (name, logo, record, standing)
      const team = feeds.map(f => f.team).find(tm => tm && tm.standingSummary) || feeds[0].team;
      return { events: [...byId.values()], team };
    });

    const loadSchedule = t => loadLive(t).catch(async err => {
      const saved = (await snapshot)?.teams?.[`${t[0]}|${t[1]}`];
      if (!saved) throw err;
      usedSnapshot = true;
      return saved;
    });

    // ESPN's per-team endpoint stopped allowing cross-site requests (Oct 2026), so team details
    // come from the schedule feed instead; reshape them into the fields renderCard reads.
    function teamFromSchedule(st, soccer, rank) {
      const logo = st.logo || "";
      const [w, a, b] = (st.recordSummary || "").split("-").map(Number); // soccer: wins-draws-losses
      const stats = soccer && st.recordSummary
        ? [{ name: "wins", value: w }, { name: "ties", value: a }, { name: "losses", value: b }, { name: "points", value: w * 3 + a }]
        : [];
      return {
        displayName: st.displayName,
        logos: logo ? [{ rel: ["full", "default"], href: logo },
                       { rel: ["full", "dark"], href: logo.replace("/500/", "/500-dark/") }] : [],
        links: st.clubhouse ? [{ rel: ["clubhouse"], href: st.clubhouse }] : [],
        record: { items: [{ summary: st.recordSummary, stats }] },
        standingSummary: st.standingSummary,
        rank,
      };
    }

    // AP Top 25 for college teams (the schedule feed doesn't carry rankings)
    const apRanks = teams.some(t => t[0] === "football/college-football")
      ? fetch("https://site.api.espn.com/apis/site/v2/sports/football/college-football/rankings")
          .then(r => r.json())
          .then(d => {
            const poll = (d.rankings || []).find(p => /AP/.test(p.name)) || (d.rankings || [])[0];
            return Object.fromEntries((poll ? poll.ranks : []).map(r => [String(r.team.id), r.current]));
          })
          .catch(async () => (await snapshot)?.ap || {})
      : Promise.resolve({});

    const competitionTag = ev => {
      const name = (ev.league && (ev.league.name || ev.league.abbreviation)) || "";
      if (/Champions League/i.test(name)) return "UCL";
      if (/Europa League/i.test(name)) return "UEL";
      if (/Conference League/i.test(name)) return "UECL";
      if (/Nations League/i.test(name)) return "UNL";
      if (/Friendly/i.test(name)) return "Friendly";
      if (/Qualif/i.test(name)) return "Qualifier";
      if (/Cup|Copa|Coupe|Coppa|Pokal|Trophy|Shield|Supercopa/i.test(name)) return "Cup";
      return "";
    };

    // Returns the next unfinished fixture as { where, name, logos, when } (or null)
    function nextGame(schedule, teamId) {
      const upcoming = (schedule.events || [])
        .filter(ev => !ev.competitions[0].status.type.completed)
        .sort((a, b) => new Date(a.date) - new Date(b.date));
      const ev = upcoming[0];
      if (!ev) return null;
      const comp = ev.competitions[0];
      const me = comp.competitors.find(c => String(c.team.id) === String(teamId));
      const opp = comp.competitors.find(c => c !== me);
      if (!opp) return null;
      const where = comp.neutralSite || (me && me.homeAway === "home") ? "vs" : "@";
      const game = { where, name: opp.team.displayName || opp.team.shortDisplayName, logos: opp.team.logos || [] };
      if (comp.status.type.state === "in") return { ...game, live: true };

      const d = new Date(ev.date);
      return {
        ...game,
        day: d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" }),
        time: ev.timeValid === false ? "" : d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }),
        tag: competitionTag(ev),
      };
    }

    // Most recent finished game as { result: "W"|"L"|"D", score, where, name, logos, when } (or null)
    function lastGame(schedule, teamId) {
      const done = (schedule.events || [])
        .filter(ev => ev.competitions[0].status.type.completed)
        .sort((a, b) => new Date(b.date) - new Date(a.date));
      const ev = done[0];
      if (!ev) return null;
      const comp = ev.competitions[0];
      const me = comp.competitors.find(c => String(c.team.id) === String(teamId));
      const opp = comp.competitors.find(c => c !== me);
      if (!me || !opp) return null;
      const pts = c => (c.score && typeof c.score === "object" ? c.score.displayValue : c.score) ?? "–";
      const result = me.winner ? "W" : opp.winner ? "L" : "D";
      const pens = me.shootoutScore != null && opp.shootoutScore != null ? ` (${me.shootoutScore}–${opp.shootoutScore} pens)` : "";
      const when = new Date(ev.date).toLocaleDateString([], { month: "short", day: "numeric" });
      return {
        result, score: `${pts(me)}–${pts(opp)}${pens}`,
        where: comp.neutralSite || me.homeAway === "home" ? "vs" : "@",
        name: opp.team.displayName || opp.team.shortDisplayName,
        logos: opp.team.logos || [], when,
      };
    }

    const oppLogo = logos => {
      const img = el("img", "opp-logo");
      img.alt = "";
      img.dataset.logos = JSON.stringify(logos);
      img.src = logoFor(logos, isDark());
      return img;
    };

    // LAST   vs (logo) Jaguars              [W] 34–31
    function fillLastGame(row, game) {
      const label = el("span", "game-label", "Last");
      if (!game) { row.replaceChildren(label, el("span", "game-opp game-empty", "No games yet")); return; }
      const opp = el("span", "game-opp");
      opp.append(el("span", "game-where", game.where), oppLogo(game.logos), el("span", "game-name", game.name));
      const right = el("span", "game-right");
      right.append(el("span", `result result-${game.result}`, game.result), el("span", "game-score", game.score));
      row.replaceChildren(label, opp, right);
      row.title = game.when;
    }

    // NEXT   @ (logo) Como                  Wed, Oct 21 · 11:45 AM
    function fillNextGame(row, game) {
      const label = el("span", "game-label", "Next");
      if (!game) { row.replaceChildren(label, el("span", "game-opp game-empty", "None scheduled")); return; }
      const opp = el("span", "game-opp");
      opp.append(el("span", "game-where", game.where), oppLogo(game.logos), el("span", "game-name", game.name));
      const right = el("span", "game-right");
      if (game.live) right.append(el("span", "live-tag", "LIVE"));
      else {
        // date over time, Real-style, so the opponent's name keeps its room
        const when = el("span", "game-when");
        when.append(el("span", "when-day", game.day), el("span", "when-time", [game.time, game.tag].filter(Boolean).join(" · ")));
        right.append(when);
      }
      row.replaceChildren(label, opp, right);
    }

    Promise.allSettled(teams.map((t, i) =>
      loadSchedule(t)
        .then(async sched => {
          const team = teamFromSchedule(sched.team, t[3], (await apRanks)[String(t[1])]);
          // before a US team's first regular-season game ESPN's record is its preseason one
          const played = sched.events.some(ev => ev.competitions[0].status.type.completed);
          if (!t[3] && !played) team.record.items[0].summary = "0-0";
          renderCard(cards[i], t, team, await fifa);
          fillLastGame(cards[i].querySelector(".game-last"), lastGame(sched, t[1]));
          fillNextGame(cards[i].querySelector(".game-next"), nextGame(sched, t[1]));
        })
        .catch(() => {
          const loading = cards[i].querySelector(".card-loading");
          if (loading) loading.textContent = `Couldn't load ${t[2]} right now.`;
        })
    )).then(async () => {
      const fmt = d => d.toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" });
      const saved = (await snapshot)?.updated;
      document.getElementById("sportsNote").textContent = usedSnapshot && saved
        ? `From ESPN · as of ${fmt(new Date(saved))}`
        : `Live from ESPN · updated ${fmt(new Date())}`;
      const f = await fifa;
      if (f) {
        const date = new Date(f.published).toLocaleDateString([], { month: "long", day: "numeric", year: "numeric" });
        document.getElementById("fifaDate").textContent = ` National teams are ranked by the FIFA World Ranking (${date}).`;
      }
    });

    // Swap logo variants when the theme toggles
    new MutationObserver(() => {
      document.querySelectorAll("img[data-logos]").forEach(img => {
        img.src = logoFor(JSON.parse(img.dataset.logos || "[]"), isDark());
      });
      document.querySelectorAll("img[data-crest]").forEach(img => {
        img.src = isDark() ? img.dataset.crestDark : img.dataset.crest;
      });
    }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  </script>
</body>
