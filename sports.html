<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sports - Palash Pawar</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <script src="theme.js"></script>
</head>
<body>
  <header class="floating-nav">
    <a href="index.html">Home</a>
    <a href="experience.html">Experience</a>
    <a href="projects.html">Projects</a>
    <a href="map.html">Map</a>
  </header>

  <main class="with-nav sports-page">
    <p class="sports-note" id="sportsNote">Loading live standings…</p>
    <div class="standings-wrap">
      <table class="standings">
        <thead>
          <tr>
            <th class="col-team">Team</th>
            <th class="col-league">League</th>
            <th>Record</th>
            <th class="col-num">Pts</th>
            <th class="col-pos">Position</th>
            <th class="col-next">Next game</th>
          </tr>
        </thead>
        <tbody id="standingsBody"></tbody>
      </table>
    </div>
    <p class="sports-footnote">Soccer records are wins-draws-losses; points apply to club soccer only. (#N) is the national ranking.<span id="fifaDate"></span></p>
  </main>

  <footer>
    <p>&copy; 2026 Palash Pawar</p>
  </footer>

  <script>
    // Teams I follow: [ESPN sport/league path, ESPN team id, league label, soccer?, short name for phones,
    //                  FIFA country code and crest image (national teams only)]
    const teams = [
      ["soccer/eng.1", 360, "Premier League", true, "Man United"],
      ["soccer/fra.1", 160, "Ligue 1", true, "PSG"],
      ["soccer/esp.1", 86, "LALIGA", true, "Real Madrid"],
      ["soccer/usa.1", 6077, "MLS", true, "Dynamo"],
      ["football/college-football", 251, "College Football", false, "Longhorns"],
      ["football/nfl", 34, "NFL", false, "Texans"],
      ["basketball/nba", 10, "NBA", false, "Rockets"],
      ["soccer/all", 660, "International", true, "USA", "USA", "img/nat-usa.png"],
      ["soccer/all", 478, "International", true, "France", "FRA", "img/nat-france.png"],
      ["soccer/all", 4385, "International", true, "India", "IND", "img/nat-india.png"],
    ];

    // National teams have no league table; their position is the FIFA World Ranking,
    // which scripts/update_fifa_rankings.py saves here (FIFA's API can't be called from the browser)
    const fifa = fetch("data/fifa-rankings.json").then(r => r.json()).catch(() => null);

    const body = document.getElementById("standingsBody");
    const isDark = () => document.documentElement.dataset.theme === "dark";

    // Pick ESPN's dark-background logo variant in dark mode when one exists
    const logoFor = (logos, dark) => {
      const pick = logos.find(l => l.rel.includes("default") && l.rel.includes(dark ? "dark" : "full") && !l.rel.includes("scoreboard"))
        || logos.find(l => l.rel.includes(dark ? "dark" : "full"))
        || logos[0];
      return pick ? pick.href : "";
    };

    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    }

    function renderRow(tr, [path, id, league, soccer, shortName, fifaCode, crest], team, rankings) {
      const rec = (team.record && team.record.items && team.record.items[0]) || {};
      const s = Object.fromEntries((rec.stats || []).map(x => [x.name, x.value]));
      const n = v => (v == null ? "–" : String(Math.round(v)));

      // Team cell: logo + name, linked to the team's ESPN page
      const link = el("a", "team-link");
      const clubhouse = (team.links || []).find(l => l.rel.includes("clubhouse"));
      if (clubhouse) { link.href = clubhouse.href; link.target = "_blank"; link.rel = "noopener"; }
      const img = el("img", "team-logo");
      img.alt = "";
      if (crest) {
        img.src = crest; // our own crest, used in both themes
        img.classList.add("crest");
      } else {
        img.dataset.logos = JSON.stringify(team.logos || []);
        img.src = logoFor(team.logos || [], isDark());
      }
      const names = el("span", "team-names");
      names.append(el("span", "name-full", team.displayName), el("span", "name-short", shortName),
                   el("span", "next-inline", "")); // phones: next game sits under the name
      link.append(img, names);

      const record = fifaCode ? "–" : soccer ? `${n(s.wins)}-${n(s.ties)}-${n(s.losses)}` : (rec.summary || "–");
      const points = soccer && !fifaCode ? n(s.points) : "–";

      // "12th in English Premier League" → "12th";  "3rd in AFC South" → "3rd AFC South"
      const m = (team.standingSummary || "").match(/^(\S+)\s+in\s+(.+)$/);
      let position = m ? (soccer ? m[1] : `${m[1]} ${m[2].replace(/ Division$/, " Div.").replace(/^(North|South)(east|west)\b/, (w, a, b) => a[0] + b[0].toUpperCase())}`) : "–";
      if (!soccer && team.rank && team.rank <= 25) position += ` (#${team.rank})`;
      if (fifaCode) {
        const f = rankings && rankings.teams[fifaCode];
        const move = f && f.previousRank ? f.previousRank - f.rank : 0;
        position = f ? `#${f.rank} FIFA${move > 0 ? ` ▲${move}` : move < 0 ? ` ▼${-move}` : ""}` : "–";
      }

      const cells = [el("td", "col-team"), el("td", "col-league", league), el("td", null, record), el("td", "col-num", points), el("td", "col-pos", position), el("td", "col-next", "…")];
      cells[0].append(link);
      tr.replaceChildren(...cells);
    }

    const rows = teams.map(t => {
      const tr = el("tr");
      const td = el("td", "row-loading", `Loading ${t[2]}…`);
      td.colSpan = 6;
      tr.append(td);
      body.append(tr);
      return tr;
    });

    // Next game: first fixture that hasn't finished. Soccer uses the "all" feed so cup and
    // Champions League games count too; fixture=true returns upcoming games rather than results.
    const scheduleUrl = ([path, id, , soccer]) =>
      `https://site.api.espn.com/apis/site/v2/sports/${soccer ? "soccer/all" : path}/teams/${id}/schedule?fixture=true`;

    const competitionTag = ev => {
      const name = (ev.league && (ev.league.name || ev.league.abbreviation)) || "";
      if (/Champions League/i.test(name)) return "UCL";
      if (/Europa League/i.test(name)) return "UEL";
      if (/Conference League/i.test(name)) return "UECL";
      if (/Nations League/i.test(name)) return "UNL";
      if (/Friendly/i.test(name)) return "Friendly";
      if (/Qualif/i.test(name)) return "Qualifier";
      if (/Cup|Copa|Coupe|Coppa|Pokal|Trophy|Shield|Supercopa/i.test(name)) return "Cup";
      return "";
    };

    // Returns the next unfinished fixture as { where, name, logos, when } (or null)
    function nextGame(schedule, teamId) {
      const upcoming = (schedule.events || [])
        .filter(ev => !ev.competitions[0].status.type.completed)
        .sort((a, b) => new Date(a.date) - new Date(b.date));
      const ev = upcoming[0];
      if (!ev) return null;
      const comp = ev.competitions[0];
      const me = comp.competitors.find(c => String(c.team.id) === String(teamId));
      const opp = comp.competitors.find(c => c !== me);
      if (!opp) return null;
      const where = comp.neutralSite || (me && me.homeAway === "home") ? "vs" : "@";
      const game = { where, name: opp.team.shortDisplayName || opp.team.displayName, logos: opp.team.logos || [] };
      if (comp.status.type.state === "in") return { ...game, live: true, when: "LIVE" };

      const d = new Date(ev.date);
      const day = d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
      const time = ev.timeValid === false ? "" : `, ${d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`;
      const tag = competitionTag(ev);
      return { ...game, when: `${day}${time}${tag ? ` · ${tag}` : ""}` };
    }

    // "vs [logo] Spurs · Sat, Oct 10, 11:30 AM" (or "LIVE · vs [logo] Spurs")
    function fillNextGame(target, game, prefix = "") {
      if (!game) { target.textContent = prefix ? "" : "–"; return; }
      const logo = el("img", "opp-logo");
      logo.alt = "";
      logo.dataset.logos = JSON.stringify(game.logos);
      logo.src = logoFor(game.logos, isDark());
      const parts = [];
      if (prefix) parts.push(prefix);
      if (game.live) parts.push(el("strong", "live-tag", "LIVE"), " · ");
      parts.push(`${game.where} `, logo, game.name);
      if (!game.live) parts.push(` · ${game.when}`);
      target.replaceChildren(...parts);
    }

    Promise.allSettled(teams.map((t, i) =>
      fetch(`https://site.api.espn.com/apis/site/v2/sports/${t[0]}/teams/${t[1]}`)
        .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(async d => renderRow(rows[i], t, d.team, await fifa))
        .then(() => fetch(scheduleUrl(t)))
        .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(sched => {
          const game = nextGame(sched, t[1]);
          fillNextGame(rows[i].querySelector("td.col-next"), game);
          fillNextGame(rows[i].querySelector(".next-inline"), game, "Next: ");
        })
        .catch(() => {
          const cell = rows[i].querySelector("td.col-next");
          if (cell) cell.textContent = "–";
          else rows[i].firstChild.textContent = `Couldn't load ${t[2]} right now.`;
        })
    )).then(async () => {
      const time = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      document.getElementById("sportsNote").textContent = `Live from ESPN · updated ${time}`;
      const f = await fifa;
      if (f) {
        const date = new Date(f.published).toLocaleDateString([], { month: "long", day: "numeric", year: "numeric" });
        document.getElementById("fifaDate").textContent = ` National teams use the FIFA World Ranking (released ${date}).`;
      }
    });

    // Swap logo variants when the theme toggles
    new MutationObserver(() => {
      document.querySelectorAll("img[data-logos]").forEach(img => {
        img.src = logoFor(JSON.parse(img.dataset.logos || "[]"), isDark());
      });
    }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  </script>
</body>
</html>
