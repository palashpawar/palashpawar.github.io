<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sports - Palash Pawar</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <script src="theme.js"></script>
</head>
<body>
  <header class="floating-nav">
    <a href="index.html">Home</a>
    <a href="experience.html">Experience</a>
    <a href="projects.html">Projects</a>
    <a href="map.html">Map</a>
  </header>

  <main class="with-nav sports-page">
    <p class="sports-note" id="sportsNote">Loading live standings…</p>
    <div class="standings-wrap">
      <table class="standings">
        <thead>
          <tr>
            <th class="col-team">Team</th>
            <th class="col-league">League</th>
            <th>Record</th>
            <th class="col-num">Pts</th>
            <th class="col-pos">Position</th>
          </tr>
        </thead>
        <tbody id="standingsBody"></tbody>
      </table>
    </div>
    <p class="sports-footnote">Soccer records are wins-draws-losses; points apply to soccer only. (#N) is the national ranking.</p>
  </main>

  <footer>
    <p>&copy; 2026 Palash Pawar</p>
  </footer>

  <script>
    // Teams I follow: [ESPN sport/league path, ESPN team id, league label, soccer?, short name for phones]
    const teams = [
      ["soccer/eng.1", 360, "Premier League", true, "Man United"],
      ["soccer/fra.1", 160, "Ligue 1", true, "PSG"],
      ["soccer/esp.1", 86, "LALIGA", true, "Real Madrid"],
      ["soccer/usa.1", 6077, "MLS", true, "Dynamo"],
      ["football/college-football", 251, "College Football", false, "Longhorns"],
      ["football/nfl", 34, "NFL", false, "Texans"],
      ["basketball/nba", 10, "NBA", false, "Rockets"],
    ];

    const body = document.getElementById("standingsBody");
    const isDark = () => document.documentElement.dataset.theme === "dark";

    // Pick ESPN's dark-background logo variant in dark mode when one exists
    const logoFor = (logos, dark) => {
      const pick = logos.find(l => l.rel.includes("default") && l.rel.includes(dark ? "dark" : "full") && !l.rel.includes("scoreboard"))
        || logos.find(l => l.rel.includes(dark ? "dark" : "full"))
        || logos[0];
      return pick ? pick.href : "";
    };

    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    }

    function renderRow(tr, [path, id, league, soccer, shortName], team) {
      const rec = (team.record && team.record.items && team.record.items[0]) || {};
      const s = Object.fromEntries((rec.stats || []).map(x => [x.name, x.value]));
      const n = v => (v == null ? "–" : String(Math.round(v)));

      // Team cell: logo + name, linked to the team's ESPN page
      const link = el("a", "team-link");
      const clubhouse = (team.links || []).find(l => l.rel.includes("clubhouse"));
      if (clubhouse) { link.href = clubhouse.href; link.target = "_blank"; link.rel = "noopener"; }
      const img = el("img", "team-logo");
      img.alt = "";
      img.dataset.logos = JSON.stringify(team.logos || []);
      img.src = logoFor(team.logos || [], isDark());
      link.append(img, el("span", "name-full", team.displayName), el("span", "name-short", shortName));

      const record = soccer ? `${n(s.wins)}-${n(s.ties)}-${n(s.losses)}` : (rec.summary || "–");
      const points = soccer ? n(s.points) : "–";

      // "12th in English Premier League" → "12th";  "3rd in AFC South" → "3rd AFC South"
      const m = (team.standingSummary || "").match(/^(\S+)\s+in\s+(.+)$/);
      let position = m ? (soccer ? m[1] : `${m[1]} ${m[2].replace(/ Division$/, " Div.").replace(/^(North|South)(east|west)\b/, (w, a, b) => a[0] + b[0].toUpperCase())}`) : "–";
      if (!soccer && team.rank && team.rank <= 25) position += ` (#${team.rank})`;

      const cells = [el("td", "col-team"), el("td", "col-league", league), el("td", null, record), el("td", "col-num", points), el("td", "col-pos", position)];
      cells[0].append(link);
      tr.replaceChildren(...cells);
    }

    const rows = teams.map(t => {
      const tr = el("tr");
      const td = el("td", "row-loading", `Loading ${t[2]}…`);
      td.colSpan = 5;
      tr.append(td);
      body.append(tr);
      return tr;
    });

    Promise.allSettled(teams.map((t, i) =>
      fetch(`https://site.api.espn.com/apis/site/v2/sports/${t[0]}/teams/${t[1]}`)
        .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(d => renderRow(rows[i], t, d.team))
        .catch(() => { rows[i].firstChild.textContent = `Couldn't load ${t[2]} right now.`; })
    )).then(() => {
      const time = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      document.getElementById("sportsNote").textContent = `Live from ESPN · updated ${time}`;
    });

    // Swap logo variants when the theme toggles
    new MutationObserver(() => {
      document.querySelectorAll(".team-logo").forEach(img => {
        img.src = logoFor(JSON.parse(img.dataset.logos || "[]"), isDark());
      });
    }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  </script>
</body>
</html>
